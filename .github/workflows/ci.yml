name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Contrôles du dépôt source
        run: ./scripts/check-source.sh
      - name: Tests du script de distribution
        run: ./scripts/test/run.sh
